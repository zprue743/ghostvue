<!doctype html>
<!--
  Token host only: no `.ghost-theme` class, so headless examples stay
  unthemed, as in the docs. `src/examples-host.ts` applies ?theme, ?density
  and ?mode before mount.
-->
<html lang="en" data-ghost-theme="default" data-ghost-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GhostVue examples</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/examples-main.ts"></script>
  </body>
</html>

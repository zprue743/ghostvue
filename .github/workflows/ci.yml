name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_heavy: ${{ steps.paths.outputs.skip_heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-changed-paths.mjs

  verify-static:
    needs: changes
    if: needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static

  verify-unit:
    needs: changes
    if: needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:unit
      - name: Summarize coverage
        if: always() && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  verify-build:
    needs: changes
    if: needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:build

  verify:
    needs: [changes, verify-static, verify-unit, verify-build]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip heavy verify (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy verify skipped for eligible path-only changes."
      - name: Require successful parallel verify jobs
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          results=(
            "${{ needs.verify-static.result }}"
            "${{ needs.verify-unit.result }}"
            "${{ needs.verify-build.result }}"
          )
          names=(verify-static verify-unit verify-build)
          for i in "${!results[@]}"; do
            if [[ "${results[$i]}" != "success" ]]; then
              echo "Required partition ${names[$i]} finished as: ${results[$i]}"
              exit 1
            fi
          done
          echo "All verify partitions succeeded."

  browser-prebuild:
    needs: changes
    if: needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ghostvue/playground build && pnpm --filter @ghostvue/docs build
      - name: Assert e2e dist outputs exist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-prebuilt-dist
          path: |
            apps/playground/dist
            apps/docs/.vitepress/dist
          retention-days: 1

  browser-shard:
    needs: [changes, browser-prebuild]
    if: needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    # Keep the image tag aligned with @playwright/test in package.json so Chromium and system fonts stay pinned.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
      PLAYWRIGHT_BLOB_REPORT: '1'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: e2e-prebuilt-dist
          path: .
      - name: Assert prebuilt dist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - run: pnpm test:e2e:prebuilt --update-snapshots=none --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: [changes, browser-prebuild, browser-shard]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Skip heavy browser (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy browser checks skipped for eligible path-only changes."
      - name: Require successful prebuild and shards
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          if [[ "${{ needs.browser-prebuild.result }}" != "success" ]]; then
            echo "browser-prebuild finished as: ${{ needs.browser-prebuild.result }}"
            exit 1
          fi
          # Matrix job aggregate result is exposed on browser-shard.
          if [[ "${{ needs.browser-shard.result }}" != "success" ]]; then
            echo "browser-shard matrix finished as: ${{ needs.browser-shard.result }}"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: actions/download-artifact@v4
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright blob reports
        if: needs.changes.outputs.skip_heavy != 'true'
        run: pnpm exec playwright merge-reports --reporter=html,github ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: failure() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_heavy: ${{ steps.paths.outputs.skip_heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: paths
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-changed-paths.mjs

  # Node compatibility matrix: `engines.node` is `>=22`, so the fast static and
  # unit partitions run on both the supported floor (22) and the current release
  # (24). Integration, build, and browser jobs stay on 22 only to keep CI cost
  # flat; they exercise the same toolchain and add little version signal. The
  # aggregate `verify` job needs every matrix leg, so its check name is unchanged.
  verify-static:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static

  verify-unit:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      VITEST_BLOB_LABEL: unit
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # One unsharded run per Node version (GHO-128). The unit suite finishes
      # well before verify-integration, and two shards cost the same test time
      # plus a second job's setup. The explicit blob name keeps this report
      # from overwriting verify-integration's default `blob.json` when
      # `verify` downloads every `vitest-blob-*` artifact into one directory.
      - name: Run unit coverage
        run: pnpm exec vitest run --coverage --reporter=blob --outputFile.blob=.vitest-reports/blob-unit.json $(node scripts/vitest-ci-args.mjs unit-exclude)
      # Only the Node 22 legs feed the merged coverage report: the Node 24 legs
      # run the same tests, and merging both would count every file twice.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.node == 22
        with:
          name: vitest-blob-unit
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  verify-integration:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_BLOB_LABEL: integration
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Run heavy integration coverage
        run: pnpm exec vitest run --coverage --reporter=blob $(node scripts/vitest-ci-args.mjs integration-heavy)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vitest-blob-integration
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  verify-build:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Vite / VitePress / tsbuildinfo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            **/node_modules/.vite
            apps/docs/.vitepress/cache
            **/*.tsbuildinfo
          key: build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('packages/**', 'apps/**', 'examples/**', 'scripts/**', 'tests/**') }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            build-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:build
        env:
          # `pnpm size` (inside verify:build) writes the Markdown report here; it
          # is written before the budget check exits, so failures are reported.
          BUNDLE_SIZE_REPORT: .artifacts/bundle-size/report.md
      - name: Summarize bundle size
        if: always() && hashFiles('.artifacts/bundle-size/report.md') != ''
        run: cat .artifacts/bundle-size/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: bundle-size-report
          path: .artifacts/bundle-size/report.md
          retention-days: 3
          if-no-files-found: ignore
      # Share the playground and docs builds produced by verify:build with
      # browser-shard so docs/playground are built once per workflow run.
      - name: Assert e2e dist outputs exist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - name: Stage e2e dist for artifact upload
        run: |
          rm -rf .artifacts/e2e-prebuilt
          mkdir -p .artifacts/e2e-prebuilt/playground .artifacts/e2e-prebuilt/docs
          cp -a apps/playground/dist/. .artifacts/e2e-prebuilt/playground/
          cp -a apps/docs/.vitepress/dist/. .artifacts/e2e-prebuilt/docs/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
          retention-days: 1

  # Builds the @ghostvue/nuxt SSR fixture (apps/nuxt-fixture) in its headless
  # default and themed opt-in variants, type-checks it against the generated
  # auto-import declarations, and checks server HTML, hydration console output,
  # interactivity, and injected CSS in Chromium. It builds only the fixture's
  # workspace dependencies, so it runs in parallel with verify-build.
  nuxt-fixture:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    # Same pinned Playwright image as browser-shard (Chromium preinstalled).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build fixture workspace dependencies
        run: pnpm --filter "@ghostvue/nuxt-fixture^..." build
      - run: pnpm test:nuxt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: nuxt-fixture-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Posts the bundle size report as one sticky PR comment. Kept out of
  # verify-build so only this job holds `pull-requests: write`, and it never
  # checks out or runs PR code. Fork PRs get a read-only token: commenting then
  # fails with a warning instead of failing CI; the budget itself is enforced by
  # verify-build either way.
  bundle-size-comment:
    needs: [changes, verify-build]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.skip_heavy != 'true' &&
      (needs.verify-build.result == 'success' || needs.verify-build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        id: download
        continue-on-error: true
        with:
          name: bundle-size-report
          path: .artifacts/bundle-size
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: steps.download.outcome == 'success'
        env:
          REPORT_PATH: .artifacts/bundle-size/report.md
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- ghostvue-bundle-size -->'
            if (!fs.existsSync(process.env.REPORT_PATH)) {
              core.notice('No bundle size report was produced; skipping comment.')
              return
            }
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT_PATH, 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              })
              const existing = comments.find(
                (comment) =>
                  comment.user?.type === 'Bot' && comment.body?.startsWith(marker),
              )
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                })
              }
            } catch (error) {
              core.warning(`Could not post the bundle size comment: ${error.message}`)
            }

  verify:
    needs:
      [
        changes,
        verify-static,
        verify-unit,
        verify-integration,
        verify-build,
        nuxt-fixture,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require path classification
        if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed (${{ needs.changes.result }})."
          exit 1
      - name: Skip heavy verify (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy verify skipped for eligible path-only changes."
      - name: Require successful parallel verify jobs
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          results=(
            "${{ needs.verify-static.result }}"
            "${{ needs.verify-unit.result }}"
            "${{ needs.verify-integration.result }}"
            "${{ needs.verify-build.result }}"
            "${{ needs.nuxt-fixture.result }}"
          )
          names=(verify-static verify-unit verify-integration verify-build nuxt-fixture)
          for i in "${!results[@]}"; do
            if [[ "${results[$i]}" != "success" ]]; then
              echo "Required partition ${names[$i]} finished as: ${results[$i]}"
              exit 1
            fi
          done
          echo "All verify partitions succeeded."
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge Vitest coverage and enforce thresholds
        if: needs.changes.outputs.skip_heavy != 'true'
        run: pnpm test:coverage:merge
      - name: Summarize coverage
        if: always() && needs.changes.outputs.skip_heavy != 'true' && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Contrast check
        if: needs.changes.outputs.skip_heavy != 'true'
        run: pnpm verify:contrast

  browser-shard:
    needs: [changes, verify-build]
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    # Keep the image tag aligned with @playwright/test in package.json so Chromium and system fonts stay pinned.
    # This image is also the Playwright browser cache: Chromium is preinstalled
    # under /ms-playwright, so no job runs `playwright install` and there is no
    # ~/.cache/ms-playwright download to cache. Running on the bare runner with
    # an actions/cache entry instead would change the fonts the committed visual
    # baselines were rendered with (see `pnpm test:visual:docker`).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
      PLAYWRIGHT_BLOB_REPORT: '1'
    timeout-minutes: 10
    # Three shards keep the browser check ahead of verify-integration (GHO-128).
    # Playwright splits by test count, not duration, so the last shard carries
    # most of the slow overlay specs: two shards would make the browser check
    # the critical path, and a fourth shard trims only ~13% off the slowest one.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
      - name: Install prebuilt dist into app paths
        run: |
          mkdir -p apps/playground/dist apps/docs/.vitepress/dist
          cp -a .artifacts/e2e-prebuilt/playground/. apps/playground/dist/
          cp -a .artifacts/e2e-prebuilt/docs/. apps/docs/.vitepress/dist/
      - name: Assert prebuilt dist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      # Chromium projects only; Firefox and WebKit run in browser-cross.
      - run: pnpm test:e2e:prebuilt --project=chromium --project=chromium-e2e --update-snapshots=none --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: error

  # Cross-browser functional matrix (GHO-54). Firefox and WebKit run only the
  # specs tagged `@cross-browser` (focus traps, nested overlays, inert, root
  # scroll lock, native radio Tab order, RTL roving and Slider geometry) through
  # the `firefox-e2e` / `webkit-e2e` projects; everything else, including all
  # visual baselines, stays Chromium-only. The same pinned Playwright image
  # ships Firefox and WebKit with their system dependencies under
  # /ms-playwright, so it is the browser install: no `playwright install` step.
  browser-cross:
    needs: [changes, verify-build]
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      HOME: /root
      PLAYWRIGHT_BLOB_REPORT: '1'
      # Unique blob name so `browser` can merge these with the Chromium shards.
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.browser }}.zip
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
      - name: Install prebuilt dist into app paths
        run: |
          mkdir -p apps/playground/dist apps/docs/.vitepress/dist
          cp -a .artifacts/e2e-prebuilt/playground/. apps/playground/dist/
          cp -a .artifacts/e2e-prebuilt/docs/. apps/docs/.vitepress/dist/
      - name: Assert prebuilt dist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - run: pnpm test:e2e:prebuilt --project=${{ matrix.browser }}-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-blob-${{ matrix.browser }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: [changes, verify-build, browser-shard, browser-cross]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require path classification
        if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed (${{ needs.changes.result }})."
          exit 1
      - name: Skip heavy browser (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy browser checks skipped for eligible path-only changes."
      - name: Require successful build, shards, and cross-browser jobs
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          if [[ "${{ needs.verify-build.result }}" != "success" ]]; then
            echo "verify-build finished as: ${{ needs.verify-build.result }}"
            exit 1
          fi
          # Matrix job aggregate result is exposed on browser-shard.
          if [[ "${{ needs.browser-shard.result }}" != "success" ]]; then
            echo "browser-shard matrix finished as: ${{ needs.browser-shard.result }}"
            exit 1
          fi
          if [[ "${{ needs.browser-cross.result }}" != "success" ]]; then
            echo "browser-cross matrix finished as: ${{ needs.browser-cross.result }}"
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright blob reports
        if: needs.changes.outputs.skip_heavy != 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/playwright/results.json
        run: pnpm exec playwright merge-reports --reporter=html,github,json ./all-blob-reports
      # GHO-42: every key mapped in a manifest's automatedKeyboard evidence
      # must have executed and passed in this run's merged chromium-e2e
      # results, not merely exist as a test title.
      - name: Verify keyboard evidence executed and passed
        if: needs.changes.outputs.skip_heavy != 'true'
        run: node scripts/check-keyboard-evidence.mjs --report .artifacts/playwright/results.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

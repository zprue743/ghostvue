name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:
  schedule:
    # Weekly full run exercises Node 24 compatibility and full scaffold verify.
    - cron: '17 5 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip_heavy: ${{ steps.paths.outputs.skip_heavy }}
      run_nuxt: ${{ steps.paths.outputs.run_nuxt }}
      run_cross_browser: ${{ steps.paths.outputs.run_cross_browser }}
      run_node24: ${{ steps.paths.outputs.run_node24 }}
      run_full_scaffold: ${{ steps.paths.outputs.run_full_scaffold }}
      e2e_scope: ${{ steps.paths.outputs.e2e_scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-changed-paths.mjs

  # Static checks run on the supported Node floor (22); Node 24 runtime
  # compatibility is exercised by `verify-unit-node24` on master pushes,
  # merge groups, weekly runs, and runtime/CI config PRs.
  verify-static:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore Prettier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .prettiercache
          key: static-prettier-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-${{ github.sha }}
          restore-keys: |
            static-prettier-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '.prettierrc.json', '.prettierignore') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:static
        env:
          # pnpm install (`prepare`) already ran registries:write; skip redundant
          # pretypecheck rewrites while keeping `pnpm registries` verification active.
          GHOSTVUE_REGISTRIES_READY: '1'

  verify-unit:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITEST_BLOB_LABEL: unit
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One unsharded run (GHO-128). The unit suite finishes well before
      # verify-integration, and two shards cost the same test time plus a
      # second job's setup. The explicit blob name keeps this report from
      # overwriting verify-integration's default `blob.json` when `verify`
      # downloads every `vitest-blob-*` artifact into one directory. The
      # `default` reporter prints failing tests in the job log (GHO-218).
      - name: Run unit coverage
        run: pnpm exec vitest run --coverage --reporter=default --reporter=blob --outputFile.blob=.vitest-reports/blob-unit.json $(node scripts/vitest-ci-args.mjs unit-exclude)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vitest-blob-unit
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Node 24 compatibility check without redundant coverage instrumentation. Runs
  # on master pushes, merge groups, weekly schedule, and runtime/CI config PRs.
  verify-unit-node24:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true' && needs.changes.outputs.run_node24 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unit compatibility check (Node 24)
        run: pnpm exec vitest run --reporter=default $(node scripts/vitest-ci-args.mjs unit-exclude)

  verify-integration:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITEST_BLOB_LABEL: integration
      VITEST_DEFER_COVERAGE_THRESHOLDS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `default` names failing tests in the job log next to the blob (GHO-218).
      - name: Run heavy integration coverage
        env:
          RUN_FULL_SCAFFOLD_VERIFY: ${{ needs.changes.outputs.run_full_scaffold == 'true' && '1' || '' }}
        run: pnpm exec vitest run --coverage --reporter=default --reporter=blob $(node scripts/vitest-ci-args.mjs integration-heavy)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vitest-blob-integration
          path: .vitest-reports
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  verify-build:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Restore VitePress cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/docs/.vitepress/cache
          key: vitepress-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/docs/**', 'docs/**', 'examples/**') }}
          restore-keys: |
            vitepress-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            vitepress-cache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:build
        env:
          # `pnpm size` (inside verify:build) writes the Markdown report here; it
          # is written before the budget check exits, so failures are reported.
          BUNDLE_SIZE_REPORT: .artifacts/bundle-size/report.md
          GHOSTVUE_REGISTRIES_READY: '1'
      # GHO-17 plan §4 / M1: there is no committed MCP asset lock hash. Rebuild
      # the bundle from sources and compare its assetBundleId with the
      # dist/assets that `pnpm build` produced, so stale assets cannot ship.
      - name: Check MCP asset bundle freshness
        run: pnpm --filter @ghostvue/mcp assets:check
      - name: Summarize bundle size
        if: always() && hashFiles('.artifacts/bundle-size/report.md') != ''
        run: cat .artifacts/bundle-size/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bundle-size-report
          path: .artifacts/bundle-size/report.md
          retention-days: 3
          if-no-files-found: ignore
      # Share the playground and docs builds produced by verify:build with
      # browser-shard so docs/playground are built once per workflow run.
      - name: Assert e2e dist outputs exist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - name: Stage e2e dist for artifact upload
        run: |
          rm -rf .artifacts/e2e-prebuilt
          mkdir -p .artifacts/e2e-prebuilt/playground .artifacts/e2e-prebuilt/docs
          cp -a apps/playground/dist/. .artifacts/e2e-prebuilt/playground/
          cp -a apps/docs/.vitepress/dist/. .artifacts/e2e-prebuilt/docs/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
          retention-days: 1

  # Builds the @ghostvue/nuxt SSR fixture (apps/nuxt-fixture) in its headless
  # default and themed opt-in variants, type-checks it against the generated
  # auto-import declarations, and checks server HTML, hydration console output,
  # interactivity, and injected CSS in Chromium. It builds only the fixture's
  # workspace dependencies, so it runs in parallel with verify-build.
  nuxt-fixture:
    needs: changes
    if: success() && needs.changes.outputs.skip_heavy != 'true' && needs.changes.outputs.run_nuxt == 'true'
    runs-on: ubuntu-latest
    # Same pinned Playwright image as browser-shard (Chromium preinstalled).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build fixture workspace dependencies
        run: pnpm --filter "@ghostvue/nuxt-fixture^..." build
      - run: pnpm test:nuxt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nuxt-fixture-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

  # Posts the bundle size report as one sticky PR comment. Kept out of
  # verify-build so only this job holds `pull-requests: write`, and it never
  # checks out or runs PR code. Fork PRs get a read-only token: commenting then
  # fails with a warning instead of failing CI; the budget itself is enforced by
  # verify-build either way.
  bundle-size-comment:
    needs: [changes, verify-build]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.changes.outputs.skip_heavy != 'true' &&
      (needs.verify-build.result == 'success' || needs.verify-build.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        id: download
        continue-on-error: true
        with:
          name: bundle-size-report
          path: .artifacts/bundle-size
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.download.outcome == 'success'
        env:
          REPORT_PATH: .artifacts/bundle-size/report.md
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- ghostvue-bundle-size -->'
            if (!fs.existsSync(process.env.REPORT_PATH)) {
              core.notice('No bundle size report was produced; skipping comment.')
              return
            }
            const body = `${marker}\n${fs.readFileSync(process.env.REPORT_PATH, 'utf8')}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              })
              const existing = comments.find(
                (comment) =>
                  comment.user?.type === 'Bot' && comment.body?.startsWith(marker),
              )
              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                })
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                })
              }
            } catch (error) {
              core.warning(`Could not post the bundle size comment: ${error.message}`)
            }

  verify:
    needs:
      [
        changes,
        verify-static,
        verify-unit,
        verify-unit-node24,
        verify-integration,
        verify-build,
        nuxt-fixture,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require path classification
        if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed (${{ needs.changes.result }})."
          exit 1
      - name: Skip heavy verify (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy verify skipped for eligible path-only changes."
      - name: Require successful parallel verify jobs
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          results=(
            "${{ needs.verify-static.result }}"
            "${{ needs.verify-unit.result }}"
            "${{ needs.verify-integration.result }}"
            "${{ needs.verify-build.result }}"
          )
          names=(verify-static verify-unit verify-integration verify-build)
          for i in "${!results[@]}"; do
            if [[ "${results[$i]}" != "success" ]]; then
              echo "Required partition ${names[$i]} finished as: ${results[$i]}"
              exit 1
            fi
          done
          if [[ "${{ needs.changes.outputs.run_nuxt }}" == "true" ]]; then
            if [[ "${{ needs.nuxt-fixture.result }}" != "success" ]]; then
              echo "Required partition nuxt-fixture finished as: ${{ needs.nuxt-fixture.result }}"
              exit 1
            fi
          elif [[ "${{ needs.nuxt-fixture.result }}" != "skipped" && "${{ needs.nuxt-fixture.result }}" != "success" ]]; then
            echo "Optional partition nuxt-fixture finished as: ${{ needs.nuxt-fixture.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run_node24 }}" == "true" ]]; then
            if [[ "${{ needs.verify-unit-node24.result }}" != "success" ]]; then
              echo "Required partition verify-unit-node24 finished as: ${{ needs.verify-unit-node24.result }}"
              exit 1
            fi
          elif [[ "${{ needs.verify-unit-node24.result }}" != "skipped" && "${{ needs.verify-unit-node24.result }}" != "success" ]]; then
            echo "Optional partition verify-unit-node24 finished as: ${{ needs.verify-unit-node24.result }}"
            exit 1
          fi
          echo "All verify partitions succeeded."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          pattern: vitest-blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: Merge Vitest coverage and enforce thresholds
        if: needs.changes.outputs.skip_heavy != 'true'
        run: pnpm test:coverage:merge
      - name: Summarize coverage
        if: always() && needs.changes.outputs.skip_heavy != 'true' && hashFiles('coverage/coverage-summary.json') != ''
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore
      - name: Contrast check
        if: needs.changes.outputs.skip_heavy != 'true'
        run: pnpm verify:contrast

  browser-shard:
    needs: [changes, verify-build]
    if: success() && needs.changes.outputs.skip_heavy != 'true'
    runs-on: ubuntu-latest
    # Keep the image tag aligned with @playwright/test in package.json so Chromium and system fonts stay pinned.
    # This image is also the Playwright browser cache: Chromium is preinstalled
    # under /ms-playwright, so no job runs `playwright install` and there is no
    # ~/.cache/ms-playwright download to cache. Running on the bare runner with
    # an actions/cache entry instead would change the fonts the committed visual
    # baselines were rendered with (see `pnpm test:visual:docker`).
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
      PLAYWRIGHT_BLOB_REPORT: '1'
      # Unique per shard so `browser` can merge every blob with merge-multiple.
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-chromium-${{ matrix.shard }}.zip
    # Each balanced shard runs about a third of the Chromium suite (~4-5 min on
    # master), so 10 minutes keeps roughly 2x headroom (GHO-254).
    timeout-minutes: 10
    # Three duration-balanced shards with 3 workers each (GHO-254). Playwright's
    # own --shard splits by test count, and the cheap `chromium` screenshot
    # tests made one of two count-based shards do ~1.6x the other's work.
    # scripts/e2e-shard-plan.mjs packs project/spec-file units by the measured
    # durations in scripts/e2e-shard-timings.json instead.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
      - name: Install prebuilt dist into app paths
        run: |
          mkdir -p apps/playground/dist apps/docs/.vitepress/dist
          cp -a .artifacts/e2e-prebuilt/playground/. apps/playground/dist/
          cp -a .artifacts/e2e-prebuilt/docs/. apps/docs/.vitepress/dist/
      - name: Assert prebuilt dist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      # Chromium projects only; Firefox and WebKit run in browser-cross.
      - name: Plan full Chromium e2e shard
        if: needs.changes.outputs.e2e_scope != 'docs'
        run: node scripts/e2e-shard-plan.mjs --shard=${{ matrix.shard }}/3 --out=.artifacts/e2e-shard-tests.txt -- --project=chromium --project=chromium-e2e
      - name: Plan docs and example Chromium e2e shard
        if: needs.changes.outputs.e2e_scope == 'docs'
        run: node scripts/e2e-shard-plan.mjs --shard=${{ matrix.shard }}/3 --out=.artifacts/e2e-shard-tests.txt -- --project=chromium --project=chromium-e2e tests/e2e/docs-*.spec.ts tests/e2e/examples*.spec.ts
      # --pass-with-no-tests: a tiny docs-scoped selection can leave a shard empty.
      - name: Run Chromium e2e shard
        run: pnpm test:e2e:prebuilt --project=chromium --project=chromium-e2e --update-snapshots=none --pass-with-no-tests --test-list .artifacts/e2e-shard-tests.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3
          if-no-files-found: error

  # Cross-browser functional checks (GHO-54). Firefox and WebKit run only the
  # specs tagged `@cross-browser` (focus traps, nested overlays, inert, root
  # scroll lock, native radio Tab order, RTL roving and Slider geometry) through
  # the `firefox-e2e` / `webkit-e2e` projects in one container job to avoid a
  # second container pull/install; everything else stays Chromium-only.
  browser-cross:
    needs: [changes, verify-build]
    if: success() && needs.changes.outputs.skip_heavy != 'true' && needs.changes.outputs.run_cross_browser == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    env:
      HOME: /root
      PLAYWRIGHT_BLOB_REPORT: '1'
      # Unique blob name so `browser` can merge this with the Chromium shards.
      PLAYWRIGHT_BLOB_OUTPUT_NAME: report-cross.zip
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-prebuilt-dist
          path: .artifacts/e2e-prebuilt
      - name: Install prebuilt dist into app paths
        run: |
          mkdir -p apps/playground/dist apps/docs/.vitepress/dist
          cp -a .artifacts/e2e-prebuilt/playground/. apps/playground/dist/
          cp -a .artifacts/e2e-prebuilt/docs/. apps/docs/.vitepress/dist/
      - name: Assert prebuilt dist
        run: test -f apps/playground/dist/index.html && test -f apps/docs/.vitepress/dist/index.html
      - run: pnpm test:e2e:prebuilt --project=firefox-e2e --project=webkit-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-blob-cross
          path: blob-report/
          retention-days: 3
          if-no-files-found: error

  browser:
    needs: [changes, verify-build, browser-shard, browser-cross]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require path classification
        if: needs.changes.result != 'success'
        run: |
          echo "changes job did not succeed (${{ needs.changes.result }})."
          exit 1
      - name: Skip heavy browser (eligible path-only PR)
        if: needs.changes.outputs.skip_heavy == 'true'
        run: echo "Heavy browser checks skipped for eligible path-only changes."
      - name: Require successful build, shards, and cross-browser jobs
        if: needs.changes.outputs.skip_heavy != 'true'
        run: |
          if [[ "${{ needs.verify-build.result }}" != "success" ]]; then
            echo "verify-build finished as: ${{ needs.verify-build.result }}"
            exit 1
          fi
          # Matrix job aggregate result is exposed on browser-shard.
          if [[ "${{ needs.browser-shard.result }}" != "success" ]]; then
            echo "browser-shard matrix finished as: ${{ needs.browser-shard.result }}"
            exit 1
          fi
          if [[ "${{ needs.changes.outputs.run_cross_browser }}" == "true" ]]; then
            if [[ "${{ needs.browser-cross.result }}" != "success" ]]; then
              echo "browser-cross finished as: ${{ needs.browser-cross.result }}"
              exit 1
            fi
          elif [[ "${{ needs.browser-cross.result }}" != "skipped" && "${{ needs.browser-cross.result }}" != "success" ]]; then
            echo "Optional browser-cross finished as: ${{ needs.browser-cross.result }}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: needs.changes.outputs.skip_heavy != 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.skip_heavy != 'true'
        with:
          pattern: playwright-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge Playwright blob reports
        if: needs.changes.outputs.skip_heavy != 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/playwright/results.json
        run: pnpm exec playwright merge-reports --reporter=html,github,json ./all-blob-reports
      # GHO-42: every key mapped in a manifest's automatedKeyboard evidence
      # must have executed and passed in this run's merged chromium-e2e
      # results, not merely exist as a test title.
      - name: Verify keyboard evidence executed and passed
        if: needs.changes.outputs.skip_heavy != 'true' && needs.changes.outputs.e2e_scope != 'docs'
        run: node scripts/check-keyboard-evidence.mjs --report .artifacts/playwright/results.json
      # Measured durations for refreshing scripts/e2e-shard-timings.json with
      # `node scripts/e2e-shard-plan.mjs --write-timings=<results.json>` (GHO-254).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: playwright-results-json
          path: .artifacts/playwright/results.json
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && needs.changes.outputs.skip_heavy != 'true'
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact version committed in all five package manifests (X.Y.Z).
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    if: github.repository == 'zprue743/ghostvue' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release/0.1.x')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate version and release branch
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          node --input-type=module -e '
            import { distributionTag } from "./scripts/publish-release.mjs"
            distributionTag(process.env.GITHUB_REF, process.env.EXPECTED_VERSION)
          '

  rehearse:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/release-dry-run.yml
    with:
      expected_version: ${{ inputs.expected_version }}
      evidence_only: true

  publish:
    needs: rehearse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run-evidence
          path: reports/release-dry-run
      - name: Publish the verified release tarballs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-release.mjs reports/release-dry-run

  verify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dry-run-evidence
          path: reports/release-dry-run
      - name: Verify a clean public install and signature attestations
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/publish-release.mjs --verify-public-install reports/release-dry-run

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Publish GitHub Release for the verified commit
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs

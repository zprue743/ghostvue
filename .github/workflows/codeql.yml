name: CodeQL

on:
  push:
    branches: [master]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.vue'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
  pull_request:
    branches: [master]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.mts'
      - '**/*.vue'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/**'
  schedule:
    # Weekly rescan picks up new CodeQL queries even when the code is unchanged.
    - cron: '27 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing at workflow level; the analyze job grants only what
# CodeQL needs to read the repository and upload SARIF results.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Read workflow run metadata (required by codeql-action on private repos).
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves (injection, unpinned refs,
        # excessive permissions). Both languages need no build: JS/TS is
        # extracted from source, so no install scripts or dependencies run.
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # init and analyze must come from the same codeql-action release.
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
